name: C/C++ CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: ./configure
    - name: install libpam0g-dev
      run: sudo apt install libpam0g-dev
    - name: make
      run: make
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pam_usbkey
        path: .
